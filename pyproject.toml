[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "repriserl"
version = "0.1.0"
description = "Policy-aware rollout reuse for LLM post-training"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "build==1.3.0"]

train = ["torch>=2.9.1,<3", "trl==1.15.0", "transformers==5.24.1", "accelerate==1.16.0"]

[project.scripts]
repriserl-train = "repriserl.train:main"
repriserl-report = "repriserl.report:main"
repriserl-evaluate = "repriserl.evaluate:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
repriserl = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["python"]
