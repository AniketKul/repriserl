# Offline CPU integration fixture. Nine optimizer steps exercise one replay batch.
max_steps: 9
max_time_seconds: 120
prompt_token_cap: 64
completion_token_cap: 6
batch_groups: 2
group_size: 4
microbatch_size: 4
learning_rate: 0.0001
beta: 0
std_convention: sample
eos_handling: include
truncation_handling: include
normalization: optimizer_batch
